# ─────────────────────────────────────────────────────────
# Deploy iamtoxico.com to GoDaddy cPanel via SFTP
# ─────────────────────────────────────────────────────────

name: Deploy to GoDaddy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      deploy_path:
        description: 'Remote path on GoDaddy'
        required: true
        default: '/iamtoxico.com/'
        type: string
      dry_run:
        description: 'Dry run (preview only, no actual upload)'
        required: false
        default: false
        type: boolean

# Serialize deploys so overlapping pushes (drop publish + backfill sweep) can't
# clobber each other on GoDaddy. Queue rather than cancel — each upload finishes
# atomically, and the newest queued run deploys last so live ends on latest content.
concurrency:
  group: deploy-godaddy
  cancel-in-progress: false

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          missing=0
          if [ -z "${{ secrets.GODADDY_SFTP_HOST }}" ]; then
            echo "❌ GODADDY_SFTP_HOST not set"
            missing=1
          fi
          if [ -z "${{ secrets.GODADDY_SFTP_USER }}" ]; then
            echo "❌ GODADDY_SFTP_USER not set"
            missing=1
          fi
          if [ -z "${{ secrets.GODADDY_SFTP_PASSWORD }}" ]; then
            echo "❌ GODADDY_SFTP_PASSWORD not set"
            missing=1
          fi
          [ "$missing" -eq 1 ] && exit 1
          echo "✅ All secrets configured"

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.GODADDY_SFTP_HOST }}
          FTP_USER: ${{ secrets.GODADDY_SFTP_USER }}
          FTP_PASS: ${{ secrets.GODADDY_SFTP_PASSWORD }}
          DEPLOY_PATH: ${{ inputs.deploy_path || '/iamtoxico.com/' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1

          # Deploy only public site assets. Keep internal tooling and staging helpers off the public host.
          EXCLUDES="-x '\.git/' -x '\.github/' -x '__pycache__/' -x 'node_modules/' -x '\.venv/' -x 'venv/' -x '\.pytest_cache/' -x '\.DS_Store' -x '\.db$' -x '\.log$' -x '\.env$' -x 'logs/' -x 'docs/' -x 'tests/' -x 'scripts/' -x 'shopify-app/' -x 'deficient/' -x 'fetch_images\.log$' -x 'add_products\.py$' -x 'remove_products\.py$' -x 'server\.py$' -x 'start\.sh$' -x 'pytest\.ini$' -x 'preview\.html$' -x 'CLAUDE\.md$' -x 'README\.md$' -x 'TOXICO_LIFE_PLANNING\.md$' -x 'PRODUCTS_TO_ADD\.md$' -x 'agents\.md$' -x 'INVENTORY_COMMANDS\.md$' -x 'features\.md$' -x 'future\.md$' -x 'data/printify_source_provenance_staging\.json$' -x 'data/rename_brief_staging\.json$' -x 'pattern\.jpg$'"

          if [ "$DRY_RUN" == "true" ]; then
            echo "🔍 DRY RUN — would upload these files:"
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
              set ftp:ssl-allow yes
              set ftp:ssl-force no
              set ssl:verify-certificate no
              set ftp:passive-mode yes
              set net:max-retries 3
              set net:reconnect-interval-base 5
              mirror --reverse --dry-run --verbose $EXCLUDES ./ $DEPLOY_PATH
              quit
            "
          else
            echo "🚀 Deploying to $DEPLOY_PATH..."
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
              set ftp:ssl-allow yes
              set ftp:ssl-force no
              set ssl:verify-certificate no
              set ftp:passive-mode yes
              set net:max-retries 3
              set net:reconnect-interval-base 5
              set mirror:parallel-transfer-count 4
              mirror --reverse --verbose --only-newer $EXCLUDES ./ $DEPLOY_PATH
              quit
            "
            echo "✅ Deploy complete"
          fi

      - name: Summary
        run: |
          echo "## 📦 iamtoxico.com Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${{ inputs.deploy_path || '/iamtoxico.com/' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${{ inputs.dry_run || false }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY