<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toxico — collection</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    background: #0b0b0b url('bg-graffiti-10.jpg') center center / cover no-repeat fixed;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 0;
  }

  header, main, footer { position: relative; z-index: 1; }

  header {
    padding: 1.5rem 2rem;
    max-width: 1280px; margin: 0 auto;
  }
  header h1 {
    font-size: 2rem; font-weight: 600;
    letter-spacing: .04em; text-transform: lowercase;
  }

  .filters {
    max-width: 1280px; margin: 0 auto;
    padding: 0 2rem .8rem;
    display: flex; gap: .5rem; flex-wrap: wrap;
  }
  .filters button {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff; font-family: inherit; font-size: .8rem;
    padding: .4em 1em; border-radius: 20px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .filters button:hover,
  .filters button.active {
    background: rgba(255,255,255,.18);
    border-color: rgba(255,255,255,.3);
  }

  main { padding: 1rem 2rem 4rem; max-width: 1280px; margin: 0 auto; }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.4rem;
  }

  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .25s, border-color .25s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,.25);
  }
  .card a.card-link {
    display: block; text-decoration: none; color: inherit;
  }
  .card .img-wrap {
    position: relative;
    width: 100%; aspect-ratio: 1;
    overflow: hidden; background: #1a1a1a;
  }
  .card .img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity .3s;
  }
  .card .img-wrap img.back {
    position: absolute; inset: 0; opacity: 0;
  }
  .card:hover .img-wrap img.front { opacity: 0; }
  .card:hover .img-wrap img.back  { opacity: 1; }

  .card .info { padding: .9rem 1rem; }
  .card .title {
    font-size: .85rem; font-weight: 600;
    margin-bottom: .2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .meta {
    font-size: .72rem; color: rgba(255,255,255,.4);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .card .price {
    font-size: .8rem; color: rgba(255,255,255,.55);
    margin-top: .15rem;
  }

  footer {
    text-align: center; padding: 2rem;
    color: rgba(255,255,255,.25); font-size: .78rem;
  }

  @media (max-width: 768px) {
    main { padding: 1rem 1rem 3rem; }
    header { padding: 1rem; }
    .filters { padding: 0 1rem .6rem; }
    #grid {
      grid-template-columns: repeat(2, 1fr);
      gap: .8rem;
    }
    .card .info { padding: .6rem .7rem; }
    .card .title { font-size: .78rem; }
  }
</style>
</head>
<body>

<header>
  <h1>toxico originals</h1>
</header>

<div class="filters">
  <button class="active" data-f="all">All</button>
  <button data-f="apres">Apres</button>
  <button data-f="harem">Harem</button>
</div>

<main>
  <div id="grid"></div>
</main>

<footer>&copy; 2025 toxico &mdash; elevated loungewear for the sporting life</footer>

<script>
const P = [
  {t:"Arctic River Apres", y:"apres", p:120, u:"https://1tap6m-et.myshopify.com/products/arctic-river-apres", f:"https://images.printify.com/mockup/69dab8f544983647c30c0e4f/74644/19527/arctic-river-apres.jpg?camera_label=front", b:"https://images.printify.com/mockup/69dab8f544983647c30c0e4f/74644/21126/arctic-river-apres.jpg?camera_label=back"},
  {t:"Arctic River Harem Pant", y:"harem", p:120, u:"https://1tap6m-et.myshopify.com/products/arctic-river", f:"https://images.printify.com/mockup/69a462891ec5ca402c037d02/72928/16656/arctic-river-harem-pant.jpg?camera_label=front", b:"https://images.printify.com/mockup/69a462891ec5ca402c037d02/72928/16657/arctic-river-harem-pant.jpg?camera_label=back"},
  {t:"Cyan Glow Apres", y:"apres", p:120, u:"https://1tap6m-et.myshopify.com/products/cyan-glow-apres", f:"https://images.printify.com/mockup/69dab930d21aa5ff4f0de9f7/74644/19527/cyan-glow-apres.jpg?camera_label=front", b:"https://images.printify.com/mockup/69dab930d21aa5ff4f0de9f7/74644/21126/cyan-glow-apres.jpg?camera_label=back"},
  {t:"Cyan Glow Harem Pant", y:"harem", p:120, u:"https://1tap6m-et.myshopify.com/products/cyan-glow", f:"https://images.printify.com/mockup/69a4628f94ca9fbf1d020f6e/72928/16656/cyan-glow-harem-pant.jpg?camera_label=front", b:"https://images.printify.com/mockup/69a4628f94ca9fbf1d020f6e/72928/16657/cyan-glow-harem-pant.jpg?camera_label=back"},
  {t:"Frozen Sky Apres", y:"apres", p:120, u:"https://1tap6m-et.myshopify.com/products/frozen-sky-apres", f:"https://images.printify.com/mockup/69dab96870e65284fd017291/74644/19527/frozen-sky-apres.jpg?camera_label=front", b:"https://images.printify.com/mockup/69dab96870e65284fd017291/74644/21126/frozen-sky-apres.jpg?camera_label=back"},
  {t:"Frozen Sky Harem Pant", y:"harem", p:120, u:"https://1tap6m-et.myshopify.com/products/frozen-sky", f:"https://images.printify.com/mockup/69a4629b7fc2996b8d0abe8e/72928/16656/frozen-sky-harem-pant.jpg?camera_label=front", b:"https://images.printify.com/mockup/69a4629b7fc2996b8d0abe8e/72928/16657/frozen-sky-harem-pant.jpg?camera_label=back"},
  {t:"Hold Cards Apres", y:"apres", p:120, u:"https://1tap6m-et.myshopify.com/products/hold-cards-apres", f:"https://images.printify.com/mockup/69dab94b631ca9e1ce049366/74644/19527/hold-cards-apres.jpg?camera_label=front", b:"https://images.printify.com/mockup/69dab94b631ca9e1ce049366/74644/21126/hold-cards-apres.jpg?camera_label=back"},
  {t:"Hold Cards Harem Pant", y:"harem", p:120, u:"https://1tap6m-et.myshopify.com/products/hold-cards", f:"https://images.printify.com/mockup/69a46294eb470f86b105fab3/72928/16656/hold-cards-harem-pant.jpg?camera_label=front", b:"https://images.printify.com/mockup/69a46294eb470f86b105fab3/72928/16657/hold-cards-harem-pant.jpg?camera_label=back"},
  {t:"Hot Oil Apres", y:"apres", p:120, u:"https://1tap6m-et.myshopify.com/products/hot-oil-apres", f:"https://images.printify.com/mockup/69dab91218173cdb1a0cb04a/74644/19527/hot-oil-apres.jpg?camera_label=front", b:"https://images.printify.com/mockup/69dab91218173cdb1a0cb04a/74644/21126/hot-oil-apres.jpg?camera_label=back"},
  {t:"Hot Oil Harem Pant", y:"harem", p:120, u:"https://1tap6m-et.myshopify.com/products/hot-oil", f:"https://images.printify.com/mockup/69a4628c9f7e893e8a0e5219/72928/16656/hot-oil-harem-pant.jpg?camera_label=front", b:"https://images.printify.com/mockup/69a4628c9f7e893e8a0e5219/72928/16657/hot-oil-harem-pant.jpg?camera_label=back"},
  {t:"Toxico Apres", y:"apres", p:120, u:"https://1tap6m-et.myshopify.com/products/toxico-apres", f:"https://images.printify.com/mockup/69dab8da70e65284fd01727d/74644/19527/toxico-apres.jpg?camera_label=front", b:"https://images.printify.com/mockup/69dab8da70e65284fd01727d/74644/21126/toxico-apres.jpg?camera_label=back"},
  {t:"Toxico Harem Pant", y:"harem", p:120, u:"https://1tap6m-et.myshopify.com/products/toxico", f:"https://images.printify.com/mockup/69a4628646730b56700a6ae1/72928/16656/toxico-harem-pant.jpg?camera_label=front", b:"https://images.printify.com/mockup/69a4628646730b56700a6ae1/72928/16657/toxico-harem-pant.jpg?camera_label=back"},
];

const grid = document.getElementById('grid');

function render(filter) {
  grid.innerHTML = '';
  const items = filter === 'all' ? P : P.filter(p => p.y === filter);
  items.forEach(p => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML =
      '<a class="card-link" href="' + p.u + '" target="_blank" rel="noopener">' +
      '<div class="img-wrap">' +
        '<img class="front" src="' + p.f + '" alt="' + p.t + '" loading="lazy">' +
        '<img class="back"  src="' + p.b + '" alt="' + p.t + ' back" loading="lazy">' +
      '</div>' +
      '<div class="info">' +
        '<div class="title">' + p.t + '</div>' +
        '<div class="meta">' + p.y + '</div>' +
        '<div class="price">$' + p.p.toFixed(2) + '</div>' +
      '</div>' +
      '</a>';
    grid.appendChild(c);
  });
}

document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.f);
  });
});

render('all');
</script>
</body>
</html>
