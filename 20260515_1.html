<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toxico — 20260515 drop #1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    background: #0b0b0b url('bg-graffiti-10.jpg') center center / cover no-repeat fixed;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 0;
  }
  header, main, footer { position: relative; z-index: 1; }

  header {
    padding: 1.5rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    max-width: 1280px; margin: 0 auto;
  }
  header h1 {
    font-size: 1.4rem; font-weight: 600;
    letter-spacing: .06em; text-transform: lowercase;
  }
  .badge {
    background: rgba(255,200,0,.15); color: #ffc800;
    font-size: .7rem; font-weight: 600; text-transform: uppercase;
    padding: .3em .7em; border-radius: 6px; letter-spacing: .08em;
  }

  main { padding: 1rem 2rem 4rem; max-width: 1280px; margin: 0 auto; }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.4rem;
  }

  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .25s, border-color .25s;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,.25);
  }
  .ordinal {
    position: absolute;
    top: .5rem; left: .5rem;
    z-index: 2;
    background: rgba(0,0,0,.65);
    color: #fff;
    font-size: .7rem; font-weight: 600;
    padding: .2em .5em; border-radius: 6px;
    letter-spacing: .04em;
    pointer-events: none;
  }
  .card .img-wrap {
    position: relative;
    width: 100%; aspect-ratio: 1;
    overflow: hidden; background: #1a1a1a;
  }
  .card .img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity .3s;
  }
  .card .img-wrap img.back {
    position: absolute; inset: 0; opacity: 0;
  }
  .card:hover .img-wrap img.front { opacity: 0; }
  .card:hover .img-wrap img.back  { opacity: 1; }

  .card.empty .img-wrap {
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.4); font-size: .75rem;
    text-transform: lowercase; letter-spacing: .05em;
  }

  .card .info { padding: .9rem 1rem; }
  .card .title {
    font-size: .85rem; font-weight: 600;
    margin-bottom: .2rem;
  }
  .card .meta {
    font-size: .7rem; opacity: .65;
    text-transform: lowercase;
  }

  footer {
    text-align: center; padding: 1rem;
    font-size: .7rem; opacity: .5;
    max-width: 1280px; margin: 0 auto;
  }

  @media (max-width: 600px) {
    #grid {
      grid-template-columns: repeat(2, 1fr);
      gap: .8rem;
    }
    .card .info { padding: .6rem .7rem; }
    .card .title { font-size: .78rem; }
  }
</style>
</head>
<body>

<header>
  <h1>toxico — 20260515 drop #1</h1>
  <span class="badge">drop preview</span>
</header>

<main>
  <div id="grid"></div>
</main>

<footer>&copy; 2026 toxico &mdash; drop 20260515 #1 &mdash; not public</footer>

<script>
// Curated 9 from the original 33-template fan. Order/names per Jason's pick list (2026-05-24).
// Original drop-preview ordinal in parens for traceback.
const P = [
  {t:"apres single",   y:"front/back/pocket",            f:"https://images-api.printify.com/mockup/6a079595d72c55b34003c4cb/74644/19527/fashion-hoodie-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a079595d72c55b34003c4cb/74644/21126/fashion-hoodie-drop-slot.jpg?camera_label=back"},   // was #12
  {t:"apres mirror",   y:"front/back/pocket",            f:"https://images-api.printify.com/mockup/6a0795960852663cf009cb94/74644/19527/fashion-hoodie-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a0795960852663cf009cb94/74644/21126/fashion-hoodie-drop-slot.jpg?camera_label=back"},   // was #13
  {t:"apres tile",     y:"front/back/pocket",            f:"https://images-api.printify.com/mockup/6a0795a50852663cf009cb99/74644/19527/cyan-glow-apres-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a0795a50852663cf009cb99/74644/21126/cyan-glow-apres-drop-slot.jpg?camera_label=back"},   // was #20
  {t:"harem brickup",  y:"right_leg/left_leg/pocket",    f:"https://images-api.printify.com/mockup/6a0795a15d21d707320f788b/72926/16656/hold-cards-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a0795a15d21d707320f788b/72926/16657/hold-cards-drop-slot.jpg?camera_label=back"},   // was #18
  {t:"harem tile",     y:"right_leg/left_leg",           f:"https://images-api.printify.com/mockup/6a0795b75d21d707320f7893/72926/16656/toxico-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a0795b75d21d707320f7893/72926/16657/toxico-drop-slot.jpg?camera_label=back"},   // was #28
  {t:"harem single",   y:"right_leg/left_leg/pocket",    f:"https://images-api.printify.com/mockup/6a0795c54e9b4ee36b040d11/72928/16656/frozen-sky-harem-pant-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a0795c54e9b4ee36b040d11/72928/16657/frozen-sky-harem-pant-drop-slot.jpg?camera_label=back"},   // was #33
  {t:"hoop full",      y:"left_leg/right_leg",           f:"https://images-api.printify.com/mockup/6a079593e006ab566109c4ac/88685/51926/basketball-rib-shorts-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a079593e006ab566109c4ac/88685/51928/basketball-rib-shorts-drop-slot.jpg?camera_label=back"},   // was #14
  {t:"hoop half",      y:"left_leg",                     f:"https://images-api.printify.com/mockup/6a0795a944285bcfb5080abd/88685/51926/basketball-rib-shorts-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a0795a944285bcfb5080abd/88685/51928/basketball-rib-shorts-drop-slot.jpg?camera_label=back"},   // was #22
  {t:"puffer single",  y:"front/back/front_right_sleeve",f:"https://images-api.printify.com/mockup/6a0795ad14136fc0de0e0178/77830/36536/mens-puffer-jacket-drop-slot.jpg?camera_label=front", b:"https://images-api.printify.com/mockup/6a0795ad14136fc0de0e0178/77830/36540/mens-puffer-jacket-drop-slot.jpg?camera_label=back"},   // was #23
];

const grid = document.getElementById('grid');
const pad = i => String(i).padStart(2, '0');

P.forEach((p, i) => {
  const ord = i + 1;
  const c = document.createElement('div');
  c.className = 'card' + (p.f ? '' : ' empty');
  const imgs = p.f
    ? '<img class="front" src="' + p.f + '" alt="' + p.t + '" loading="lazy">' +
      (p.b ? '<img class="back" src="' + p.b + '" alt="' + p.t + ' back" loading="lazy">' : '')
    : 'mockup pending';
  c.innerHTML =
    '<span class="ordinal">#' + pad(ord) + '</span>' +
    '<div class="img-wrap">' + imgs + '</div>' +
    '<div class="info">' +
      '<div class="title">' + p.t + '</div>' +
      '<div class="meta">' + p.y + '</div>' +
    '</div>';
  grid.appendChild(c);
});
</script>
</body>
</html>
