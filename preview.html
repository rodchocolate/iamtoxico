const grid = document.getElementById('grid');

function render(filter) {
  grid.innerHTML = '';
  const items = filter === 'all' ? P : P.filter(p => p.s === filter);
  items.forEach(p => {
    const c = document.createElement('div');
    c.className = 'card';
    const price = typeof p.p === 'number' ? '<div class="price">$' + p.p.toFixed(2) + '</div>' : '';
    const inner =
      '<span class="shop-badge ' + p.s + '">' + p.s + '</span>' +
      '<div class="img-wrap">' +
        '<img class="front" src="' + p.f + '" alt="' + p.t + '" loading="lazy">' +
        '<img class="back"  src="' + p.b + '" alt="' + p.t + ' back" loading="lazy">' +
      '</div>' +
      '<div class="info">' +
        '<div class="title">' + p.t + '</div>' +
        '<div class="meta">' + p.y + '</div>' +
        price +
      '</div>';
    c.innerHTML = p.u
      ? '<a class="card-link" href="' + p.u + '">' + inner + '</a>'
      : inner;
    grid.appendChild(c);
  });
}

document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.f);
  });
});

render('all');
