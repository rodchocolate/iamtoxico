<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    background: #0b0b0b url('bg-graffiti-10.jpg') center center / cover no-repeat fixed;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 0;
  }
  header, main, footer { position: relative; z-index: 1; }

  header {
    padding: 1.5rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    max-width: 1280px; margin: 0 auto;
  }
  header h1 {
    font-size: 1.4rem; font-weight: 600;
    letter-spacing: .06em; text-transform: lowercase;
  }
  .badge {
    background: rgba(255,200,0,.15); color: #ffc800;
    font-size: .7rem; font-weight: 600; text-transform: uppercase;
    padding: .3em .7em; border-radius: 6px; letter-spacing: .08em;
  }

  .filters {
    max-width: 1280px; margin: 0 auto;
    padding: 0 2rem .8rem;
    display: flex; gap: .5rem; flex-wrap: wrap;
  }
  .filters button {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff; font-family: inherit; font-size: .8rem;
    padding: .4em 1em; border-radius: 20px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .filters button:hover,
  .filters button.active {
    background: rgba(255,255,255,.18);
    border-color: rgba(255,255,255,.3);
  }

  /* ── GRID: 3 across desktop, 2 across mobile ── */
  main { padding: 1rem 2rem 4rem; max-width: 1280px; margin: 0 auto; }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.4rem;
  }

  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .25s, border-color .25s;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,.25);
  }
  .card a.card-link {
    display: block; text-decoration: none; color: inherit;
  }
  .card .img-wrap {
    position: relative;
    width: 100%; aspect-ratio: 1;
    overflow: hidden; background: #1a1a1a;
  }
  .card .img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity .3s;
  }
  .card .img-wrap img.back {
    position: absolute; inset: 0; opacity: 0;
  }
  .card:hover .img-wrap img.front { opacity: 0; }
  .card:hover .img-wrap img.back  { opacity: 1; }

  .card .info { padding: .9rem 1rem; }
  .card .title {
    font-size: .85rem; font-weight: 600;
    margin-bottom: .2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .meta {
    font-size: .72rem; color: rgba(255,255,255,.4);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .card .price {
    font-size: .8rem; color: rgba(255,255,255,.55);
    margin-top: .15rem;
  }
  .shop-badge {
    position: absolute; top: 8px; right: 8px;
    font-size: .6rem; font-weight: 700; text-transform: uppercase;
    padding: .2rem .5rem; border-radius: 4px; letter-spacing: .06em;
  }
  .shop-badge.staging { background: #ff4d4d; color: #fff; }
  .shop-badge.live    { background: #00c864; color: #000; }

  footer {
    text-align: center; padding: 2rem;
    color: rgba(255,255,255,.25); font-size: .78rem;
  }

  @media (max-width: 768px) {
    main { padding: 1rem 1rem 3rem; }
    header { padding: 1rem; }
    .filters { padding: 0 1rem .6rem; }
    #grid {
      grid-template-columns: repeat(2, 1fr);
      gap: .8rem;
    }
    .card .info { padding: .6rem .7rem; }
    .card .title { font-size: .78rem; }
  }
</style>

const grid = document.getElementById('grid');

function render(filter) {
  grid.innerHTML = '';
  const items = filter === 'all' ? P : P.filter(p => p.s === filter);
  items.forEach(p => {
    const c = document.createElement('div');
    c.className = 'card';
    const price = typeof p.p === 'number' ? '<div class="price">$' + p.p.toFixed(2) + '</div>' : '';
    const inner =
      '<span class="shop-badge ' + p.s + '">' + p.s + '</span>' +
      '<div class="img-wrap">' +
        '<img class="front" src="' + p.f + '" alt="' + p.t + '" loading="lazy">' +
        '<img class="back"  src="' + p.b + '" alt="' + p.t + ' back" loading="lazy">' +
      '</div>' +
      '<div class="info">' +
        '<div class="title">' + p.t + '</div>' +
        '<div class="meta">' + p.y + '</div>' +
        price +
      '</div>';
    c.innerHTML = p.u
      ? '<a class="card-link" href="' + p.u + '" target="_blank" rel="noopener">' + inner + '</a>'
      : inner;
    grid.appendChild(c);
  });
}

document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.f);
  });
});

render('all');
</script>
