<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>toxico — yoycol test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    background: #0b0b0b url('bg-graffiti-10.jpg') center center / cover no-repeat fixed;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 0;
  }
  header, main { position: relative; z-index: 1; }

  header {
    padding: 1.5rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    max-width: 1280px; margin: 0 auto;
  }
  header h1 {
    font-size: 1.4rem; font-weight: 600;
    letter-spacing: .06em; text-transform: lowercase;
  }
  .badge {
    background: rgba(255,200,0,.15); color: #ffc800;
    font-size: .7rem; font-weight: 600; text-transform: uppercase;
    padding: .3em .7em; border-radius: 6px; letter-spacing: .08em;
  }

  main { padding: 1rem 2rem 4rem; max-width: 1280px; margin: 0 auto; }

  #grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.4rem;
  }

  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .25s, border-color .25s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,.25);
  }
  .card .img-wrap {
    width: 100%; aspect-ratio: 1;
    overflow: hidden; background: #1a1a1a;
  }
  .card .img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .card .info { padding: .9rem 1rem; }
  .card .title {
    font-size: .85rem; font-weight: 600;
    margin-bottom: .2rem;
  }
  .card .meta {
    font-size: .75rem; color: rgba(255,255,255,.55);
  }

  @media (max-width: 640px) {
    #grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>iamtoxico</h1>
  <span class="badge">yoycol test</span>
</header>
<main>
  <div id="grid">
    <div class="card">
      <div class="img-wrap">
        <img src="https://clkj-hk-prod.oss-accelerate.aliyuncs.com/yoycol/upload/321225-57b12a1a-5c92-4e43-9d6c-6af088a0fa25.jpg" alt="All-Over Print Men's Hooded Jumpsuit">
      </div>
      <div class="info">
        <div class="title">All-Over Print Men's Hooded Jumpsuit</div>
        <div class="meta">P7UMT</div>
      </div>
    </div>
    <div class="card">
      <div class="img-wrap">
        <img src="https://clkj-hk-prod.oss-accelerate.aliyuncs.com/yoycol/upload/321225-09f277d7-861c-4355-8a7e-37f98aa85d23.jpg" alt="All-Over Print Men's Stylish Hoodie with Thumb Hole Design">
      </div>
      <div class="info">
        <div class="title">All-Over Print Men's Stylish Hoodie with Thumb Hole Design</div>
        <div class="meta">P7UL6</div>
      </div>
    </div>
    <div class="card">
      <div class="img-wrap">
        <img src="https://clkj-hk-prod.oss-accelerate.aliyuncs.com/yoycol/upload/321225-43b9a0a8-275a-4158-b2f5-654b0a83cc65.jpg" alt="All-Over Print Men's Horn Button Long Fleece Windbreaker">
      </div>
      <div class="info">
        <div class="title">All-Over Print Men's Horn Button Long Fleece Windbreaker</div>
        <div class="meta">P7UKX</div>
      </div>
    </div>
    <div class="card">
      <div class="img-wrap">
        <img src="https://clkj-hk-prod.oss-accelerate.aliyuncs.com/yoycol/upload/321225-592a852e-efab-428b-8915-2d88f5226abd.jpg" alt="All-Over Print Unisex Long Down Jacket">
      </div>
      <div class="info">
        <div class="title">All-Over Print Unisex Long Down Jacket</div>
        <div class="meta">P7UJR</div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
