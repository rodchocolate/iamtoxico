<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toxico — scratch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', sans-serif; color: #fff;
    background: #0b0b0b url('../bg-graffiti-10.jpg') center center / cover no-repeat fixed;
    min-height: 100vh;
  }
  body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 0; }
  header, main, footer { position: relative; z-index: 1; }
  header {
    padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between;
    max-width: 1280px; margin: 0 auto;
  }
  header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: .06em; text-transform: lowercase; }
  .badge {
    background: rgba(255,200,0,.15); color: #ffc800; font-size: .7rem; font-weight: 600;
    text-transform: uppercase; padding: .3em .7em; border-radius: 6px; letter-spacing: .08em;
  }
  main { padding: 1rem 2rem 4rem; max-width: 1280px; margin: 0 auto; }
  .row-label { font-size: 1.4rem; opacity: .55; text-transform: uppercase; letter-spacing: .12em; margin: 1.5rem 0 .6rem; }

  /* each row is a 3-wide horizontal carousel (scroll/swipe through the rest) */
  .grid {
    display: grid; grid-auto-flow: column;
    grid-auto-columns: calc((100% - 2.8rem) / 3);
    gap: 1.4rem; overflow-x: auto; scroll-snap-type: x mandatory;
    padding-bottom: 1rem; scrollbar-width: thin;
  }
  .card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; overflow: hidden; position: relative;
    scroll-snap-align: start; transition: transform .25s, border-color .25s;
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.25); }
  .card .img-wrap { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; background: #1a1a1a; }
  .card .img-wrap a.img-link { display: block; width: 100%; height: 100%; }
  .card .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: opacity .3s; }
  a.collection-link { color: inherit; text-decoration: none; }
  a.collection-link:hover { color: #ffc800; text-decoration: underline; }
  .card .img-wrap img.back { position: absolute; inset: 0; opacity: 0; }
  .card:hover .img-wrap img.front { opacity: 0; }
  .card:hover .img-wrap img.back  { opacity: 1; }
  .card.empty .img-wrap {
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.4); font-size: .75rem; text-transform: lowercase; letter-spacing: .05em;
  }
  .card .info { padding: .9rem 1rem; }
  .card .title { font-size: .85rem; font-weight: 600; margin-bottom: .2rem; }
  .card .meta { font-size: .7rem; opacity: .65; text-transform: lowercase; }
  .card .buy {
    display: inline-block; margin-top: .5rem; font-size: .72rem; font-weight: 600; color: #ffc800;
    text-decoration: none; border: 1px solid rgba(255,200,0,.4); padding: .25em .7em; border-radius: 6px;
  }
  footer { text-align: center; padding: 1rem; font-size: .7rem; opacity: .5; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 600px) {
    .grid { grid-auto-columns: calc((100% - .8rem) / 2); gap: .8rem; }
    .card .info { padding: .6rem .7rem; } .card .title { font-size: .78rem; }
  }
</style>
</head>
<body>
<header>
  <h1>toxico — scratch</h1>
  <span class="badge">staging board</span>
</header>
<main id="main"></main>
<footer>&copy; 2026 toxico &mdash; scratch &mdash; staging board, not promoted</footer>
<script>
function tileHtml(p) {
  const empty = !p.f;
  let imgs = empty
    ? 'mockup pending'
    : '<img class="front" src="' + p.f + '" alt="' + p.t + '" loading="lazy">' +
      (p.b ? '<img class="back" src="' + p.b + '" alt="' + p.t + ' back" loading="lazy">' : '');
  // image -> product page (p.u); plain image when no URL yet (staging)
  if (p.u) imgs = '<a class="img-link" href="' + p.u + '" target="_blank" rel="noopener">' + imgs + '</a>';
  // buy button -> prefilled checkout (p.buy), separate from the product-page image link
  const buy = p.buy ? '<a class="buy" href="' + p.buy + '" target="_blank" rel="noopener">buy' + (p.y ? ' ' + p.y : '') + '</a>' : '';
  return '<div class="card' + (empty ? ' empty' : '') + '">' +
           '<div class="img-wrap">' + imgs + '</div>' +
           '<div class="info">' +
             '<div class="title">' + (p.t || '') + '</div>' +
             '<div class="meta">' + (p.y || '') + '</div>' + buy +
           '</div>' +
         '</div>';
}
function renderTiles(data) {
  const main = document.getElementById('main');
  (data.rows || []).forEach(row => {
    if (row.label) {
      const lbl = document.createElement('div');
      lbl.className = 'row-label';
      // row header -> collection page (row.href); plain text when no URL yet (staging)
      if (row.href) {
        const a = document.createElement('a');
        a.href = row.href; a.target = '_blank'; a.rel = 'noopener';
        a.className = 'collection-link'; a.textContent = row.label + ' →';
        lbl.appendChild(a);
      } else {
        lbl.textContent = row.label;
      }
      main.appendChild(lbl);
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.innerHTML = (row.tiles || []).map(tileHtml).join('');
    main.appendChild(grid);
  });
}
document.addEventListener('DOMContentLoaded', () => {
  const el = document.getElementById('tiles-data');
  renderTiles(el ? JSON.parse(el.textContent) : {rows: []});
});
</script>
