<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    background: #0b0b0b url('bg-graffiti-10.jpg') center center / cover no-repeat fixed;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 0;
  }

  header, main, footer { position: relative; z-index: 1; }

  header {
    padding: 1.5rem 2rem;
    max-width: 1280px; margin: 0 auto;
  }
  header h1 {
    font-size: 2rem; font-weight: 600;
    letter-spacing: .04em; text-transform: lowercase;
  }

  .filters {
    max-width: 1280px; margin: 0 auto;
    padding: 0 2rem .8rem;
    display: flex; gap: .5rem; flex-wrap: wrap;
  }
  .filters button {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff; font-family: inherit; font-size: .8rem;
    padding: .4em 1em; border-radius: 20px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .filters button:hover,
  .filters button.active {
    background: rgba(255,255,255,.18);
    border-color: rgba(255,255,255,.3);
  }

  main { padding: 1rem 2rem 4rem; max-width: 1280px; margin: 0 auto; }

  .row-label {
    font-size: 1.3rem; opacity: .55;
    text-transform: lowercase; letter-spacing: .12em;
    margin: 1.6rem 0 .6rem;
  }
  .row {
    display: grid; grid-auto-flow: column;
    grid-auto-columns: calc((100% - 2.8rem) / 3);
    gap: 1.4rem; overflow-x: auto; scroll-snap-type: x mandatory;
    padding-bottom: 1rem; scrollbar-width: thin;
  }
  .row .card { scroll-snap-align: start; }

  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .25s, border-color .25s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,.25);
  }
  .card a.card-link {
    display: block; text-decoration: none; color: inherit;
  }
  .card .img-wrap {
    position: relative;
    width: 100%; aspect-ratio: 1;
    overflow: hidden; background: #1a1a1a;
  }
  .card .img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: opacity .3s;
  }
  .card .img-wrap img.back {
    position: absolute; inset: 0; opacity: 0;
  }
  .card:hover .img-wrap img.front { opacity: 0; }
  .card:hover .img-wrap img.back  { opacity: 1; }

  .card .info { padding: .9rem 1rem; }
  .card .title {
    font-size: .85rem; font-weight: 600;
    margin-bottom: .2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .meta {
    font-size: .72rem; color: rgba(255,255,255,.4);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .card .price {
    font-size: .8rem; color: rgba(255,255,255,.55);
    margin-top: .15rem;
  }

  footer {
    text-align: center; padding: 2rem;
    color: rgba(255,255,255,.25); font-size: .78rem;
  }

  @media (max-width: 768px) {
    main { padding: 1rem 1rem 3rem; }
    header { padding: 1rem; }
    .filters { padding: 0 1rem .6rem; }
    .row {
      grid-auto-columns: calc((100% - .8rem) / 2);
      gap: .8rem;
    }
    .card .info { padding: .6rem .7rem; }
    .card .title { font-size: .78rem; }
  }
</style>

const STYLES = [
  {y: "apres", label: "apres"},
  {y: "harem", label: "harem"},
  {y: "hoop", label: "hoop"},
  {y: "backpack", label: "backpack"},
];

const rows = document.getElementById('rows');

STYLES.forEach(s => {
  const items = P.filter(p => p.y === s.y);
  if (!items.length) return;
  const label = document.createElement('div');
  label.className = 'row-label';
  label.textContent = s.label;
  rows.appendChild(label);
  const row = document.createElement('div');
  row.className = 'row';
  items.forEach(p => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML =

        '<div class="meta">' + p.y + '</div>' +
        '<div class="price">$' + p.p.toFixed(2) + '</div>' +
      '</div>' +
      '</a>';
    row.appendChild(c);
  });
  rows.appendChild(row);
